[package]
name = "tauri-app"
version = "0.2.0"
description = "A Tauri App"
authors = ["Magnus Redkin"]
license = "MPL-2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

tauri-plugin-websocket = "2.5.0"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"

once_cell = "1"
dotenv = "0.15"

# Локальный RPC-форвардер (src/rpc_proxy.rs).
# reqwest с rustls: в дереве уже есть ring/rustls, поэтому сборка идёт офлайн
# без openssl. Фича http2 не нужна — прокси работает по HTTP/1.1.
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "ansi", "time"] }
tracing-appender = "0.2.5"
tauri-plugin-updater = "2"

# Разбор ссылок-приглашений Status (src/invite.rs).
#
# Ссылка на канал несёт brotli-сжатый protobuf, а в webview brotli не
# декодируется: DecompressionStream в Chromium знает только gzip и deflate.
# Версия 9 уже есть в кэше зависимостей (приходит транзитивно), поэтому
# сборка не требует сети.
base64 = "0.22"
brotli-decompressor = "6.0"

# Внешние источники (src/providers.rs): разбор RSS/Atom и страниц Telegram.
# Версии уже лежат в кэше зависимостей, поэтому сборка идёт офлайн.
quick-xml = "0.42"
regex = "1"
url = "2"

# Открытие внешних ссылок системным обработчиком (src/opener.rs).
#
# Через плагин `shell` это требует разрешения `shell:allow-open` в
# capabilities, то есть права открывать произвольные адреса из webview. Здесь
# адрес проверяется в Rust, а системе передаётся уже проверенный.
# Уже в дереве как транзитивная зависимость `tauri-plugin-shell`.
open = "5"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
